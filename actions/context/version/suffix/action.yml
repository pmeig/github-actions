name: find suffix version
description: find suffix by env

inputs:
  env:
    description: environment to construct version
    required: true
  dispatch:
    description: "'false' gives the suffix of the environment (-SNAPSHOT, -RC) on a manual run too, instead of -TRY / -FIX"
    required: false
    default: 'true'
outputs:
  value:
    value: ${{ steps.before.outputs.value }}${{ steps.suffix.outputs.value }}
    description: get suffix

runs:
  using: composite
  steps:
    - name: suffix environment
      id: suffix
      shell: bash
      if: ${{ inputs.env != 'prod' && (github.event_name != 'workflow_dispatch' || inputs.dispatch == 'false') }}
      run: |
        suffix='-SNAPSHOT'
        if [ "${{ inputs.env }}" == 'prep' ]
        then
          suffix='-RC'
        fi
        echo "value=$suffix" >> $GITHUB_OUTPUT

    - name: before suffix
      shell: bash
      id: before
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch != 'false' }}
      run: |
        suffix='-TRY'
        if [  "${{ inputs.env }}" != 'dev' ]
        then
          suffix='-FIX'
        fi
        echo "value=$suffix" >> $GITHUB_OUTPUT
