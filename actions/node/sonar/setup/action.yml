name: sonar configuration for node
description: >
  generate sonar-project.properties of a node module (jest or vitest) when the module has none;
  call it after the tests with coverage to point at the lcov.info they produced

inputs:
  workspace:
    default: '.'
    required: false
    description: 'module folder, where sonar-project.properties is read or generated'
  key:
    default: ''
    required: false
    description: 'sonar.projectKey, default <repository> or <repository>-<module folder> when workspace is not the root'
  sources:
    default: 'src'
    description: folder sources to control
    required: false
  sources-test:
    default: ''
    description: 'folder test sources, default the first existing of test, tests, __tests__ (none: tests next to the sources)'
    required: false
  test-inclusions:
    default: '**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx'
    description: test files (sonar.test.inclusions)
    required: false
  exclusion:
    default: 'jest.config.ts,vitest.config.ts,**/*.spec.ts,**/*.test.ts,**/*.js'
    description: exclude for analyses in sonar (sonar.exclusions)
    required: false
  coverage-exclusions:
    default: ''
    description: 'files without behavior to exclude from coverage, separated by comma (sonar.coverage.exclusions)'
    required: false
  lcov:
    default: ''
    description: 'lcov report relative to workspace, default the lcov.info found in the module (jest and vitest), else coverage/lcov.info'
    required: false
  tsconfig:
    description: path of tsconfig
    default: 'tsconfig.json'
    required: false
  manager:
    default: 'npm'
    description: deprecated, unused (the lcov report is found without the test runner)
    required: false

outputs:
  config:
    value: ${{ inputs.workspace }}/sonar-project.properties
    description: config sonar
  key:
    value: ${{ steps.properties.outputs.key }}
    description: sonar.projectKey used

runs:
  using: composite
  steps:
    - name: create sonar-project.properties
      id: properties
      shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        KEY: ${{ inputs.key }}
        WORKSPACE: ${{ inputs.workspace }}
        SOURCES: ${{ inputs.sources }}
        TESTS: ${{ inputs.sources-test }}
        TEST_INCLUSIONS: ${{ inputs.test-inclusions }}
        EXCLUSIONS: ${{ inputs.exclusion }}
        COVERAGE_EXCLUSIONS: ${{ inputs.coverage-exclusions }}
        LCOV: ${{ inputs.lcov }}
        TSCONFIG: ${{ inputs.tsconfig }}
      run: |
        if [ -f sonar-project.properties ]
        then
          echo "::notice title=sonar::$WORKSPACE/sonar-project.properties exists, not generated"
          echo "key=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d'=' -f2-)" >> $GITHUB_OUTPUT
          exit 0
        fi

        key="$KEY"
        if [ -z "$key" ]
        then
          key="${GITHUB_REPOSITORY#*/}"
          module=$(basename "$(realpath .)")
          if [ "$(realpath .)" != "$(realpath "$GITHUB_WORKSPACE")" ]
          then
            key="$key-$module"
          fi
        fi

        tests="$TESTS"
        if [ -z "$tests" ]
        then
          for folder in test tests __tests__
          do
            if [ -d "$folder" ]
            then
              tests="$folder"
              break
            fi
          done
        fi

        lcov="$LCOV"
        if [ -z "$lcov" ]
        then
          lcov=$(find . -name lcov.info -not -path '*/node_modules/*' | head -n 1)
          lcov="${lcov#./}"
        fi
        lcov="${lcov:-coverage/lcov.info}"

        {
          echo "sonar.projectKey=$key"
          echo "sonar.projectName=$key"
          if [ -f package.json ]
          then
            echo "sonar.projectVersion=$(jq -r '.version' package.json)"
          fi
          echo 'sonar.sourceEncoding=UTF-8'
          echo "sonar.sources=$SOURCES"
          echo "sonar.exclusions=$EXCLUSIONS"
          if [ -n "$tests" ]
          then
            echo "sonar.tests=$tests"
          else
            echo "sonar.tests=$SOURCES"
          fi
          echo "sonar.test.inclusions=$TEST_INCLUSIONS"
          echo "sonar.typescript.tsconfigPaths=$TSCONFIG"
          echo "sonar.javascript.lcov.reportPaths=$lcov"
          if [ -n "$COVERAGE_EXCLUSIONS" ]
          then
            echo "sonar.coverage.exclusions=$COVERAGE_EXCLUSIONS"
          fi
        } > sonar-project.properties

        echo "key=$key" >> $GITHUB_OUTPUT
        cat sonar-project.properties
