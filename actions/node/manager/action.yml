name: node manager
description: interpret manager use on project (npm/pnpm/yarn)

inputs:
  workspace:
    default: '.'
    required: false
    description: folder of the node project (package.json, lockfile), relative to the repository root

outputs:
  value:
    value: ${{ steps.yarn.outputs.value }}${{ steps.pnpm.outputs.value }}${{ steps.npm.outputs.value }}
    description: return
  lockfile:
    value: ${{ steps.yarn.outputs.lockfile }}${{ steps.pnpm.outputs.lockfile }}${{ steps.npm.outputs.lockfile }}
    description: lockfile of the manager, relative to the repository root (cache key of setup-node); empty when the project has none

runs:
  using: composite
  steps:
    - name: is pnpm
      id: pnpm
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        if [ -f "pnpm-workspace.yaml" ] || [ -f "pnpm-lock.yaml" ]
        then
          echo value=pnpm >> $GITHUB_OUTPUT
          # pnpm-workspace.yaml without pnpm-lock.yaml: no lockfile, setup-node then runs without cache
          if [ -f "pnpm-lock.yaml" ]
          then
            echo lockfile=${{ inputs.workspace }}/pnpm-lock.yaml >> $GITHUB_OUTPUT
          fi
        fi
    - name: is yarn
      id: yarn
      shell: bash
      working-directory: ${{ inputs.workspace }}
      if: ${{ steps.pnpm.outputs.value == '' }}
      run: |
        if [ -f "yarn.lock" ]
        then
          echo value=yarn >> $GITHUB_OUTPUT
          echo lockfile=${{ inputs.workspace }}/yarn.lock >> $GITHUB_OUTPUT
        fi
    - name: is npm
      id: npm
      shell: bash
      working-directory: ${{ inputs.workspace }}
      if: ${{ steps.pnpm.outputs.value == '' && steps.yarn.outputs.value == '' }}
      run: |
        echo value=npm >> $GITHUB_OUTPUT
        # a project may keep its lockfile out of git (.gitignore): no lockfile, setup-node then runs without cache
        if [ -f "package-lock.json" ]
        then
          echo lockfile=${{ inputs.workspace }}/package-lock.json >> $GITHUB_OUTPUT
        elif [ -f "npm-shrinkwrap.json" ]
        then
          echo lockfile=${{ inputs.workspace }}/npm-shrinkwrap.json >> $GITHUB_OUTPUT
        fi
