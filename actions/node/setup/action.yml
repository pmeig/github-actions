name: setup node
description: prepare setup to node

inputs:
  version:
    default: '24'
    description: version node do you want to setup
    required: false
  branch:
    required: true
    description: ''


  artifactory-user:
    description: user use to connect at jfrog
    required: false
    default: ""
  artifactory-password:
    description: password use to connect at jfrog
    required: false
    default: ""
  artifactory-url:
    required: false
    default: 'http://jfrog:8081'
    description: artifactory url do you want to connect
  remote-token:
    description: token use to connect at remote
    required: false
    default: ''
  remote-user:
    description: user use to connect at remote
    required: false
    default: ''
  workspace:
    default: '.'
    required: false
    description: folder of the node project (package.json, lockfile, node_modules), relative to the repository root

runs:
  using: composite
  steps:
    - uses: pmeig/github-actions/actions/node/manager@main
      id: manager
      with:
        workspace: ${{ inputs.workspace }}
    # the package manager must be installed before setup-node: `cache: <manager>` runs it
    # (`pnpm store path`, `yarn cache dir`) to find the cache directory
    - name: Install pnpm
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: pnpm/action-setup@v6
      with:
        # pnpm version from the packageManager field of the project in the workspace
        package_json_file: ${{ inputs.workspace }}/package.json
    - name: Install yarn
      if: ${{ steps.manager.outputs.value == 'yarn' }}
      shell: bash
      run: |
        npm i -g yarn
    - uses: actions/setup-node@v6
      id: setup-node-version
      with:
        node-version: ${{ inputs.version }}
        cache: ${{ steps.manager.outputs.value }}
        cache-dependency-path: ${{ steps.manager.outputs.lockfile }}
    - name: remote
      shell: bash
      if: ${{ inputs.remote-token != '' }}
      run: |
        ${{ steps.manager.outputs.value }} config set registry=https://registry.npmjs.org/
        if [ -n "${{ inputs.remote-user }}" ]
        then
          export AUTH_REMOTE=$(echo -n ${{ inputs.remote-user }}:${{ inputs.remote-password }} | base64 -w0)
          echo "//registry.npmjs.org/:_auth=$AUTH_REMOTE" >> ~/.npmrc
        else
          echo "//registry.npmjs.org/:_authToken=${{ inputs.remote-token }}" >> ~/.npmrc
        fi

    - shell: bash
      name: artifactory settings
      if: ${{ inputs.artifactory-user != '' && inputs.artifactory-password != '' }}
      run: |
        export AUTH=$(echo -n ${{ inputs.artifactory-user }}:${{ inputs.artifactory-password }} | base64 -w0)
        ${{ steps.manager.outputs.value }} config set @pmeig:registry=${{ inputs.artifactory-url }}/artifactory/
        {
          echo //${{ inputs.artifactory-url }}/artifactory/npm-snapshots-local:_auth=${AUTH}
          echo //${{ inputs.artifactory-url }}/artifactory/npm-releases-local:_auth=${AUTH}
          echo //${{ inputs.artifactory-url }}/artifactory/node:_auth=${AUTH}
        } >> ~/.npmrc

    - name: cache node_modules
      uses: actions/cache@v5
      with:
        key: ${{ steps.manager.outputs.value }}-${{ inputs.branch }}
        path: ${{ inputs.workspace }}/node_modules
