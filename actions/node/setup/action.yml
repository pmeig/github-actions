name: setup node
description: prepare setup to node

inputs:
  version:
    default: '24'
    description: version node do you want to setup
    required: false
  branch:
    required: false
    default: ''
    description: unused, kept so that existing callers passing it stay valid
  cache:
    required: false
    default: 'false'
    description: "'true' caches the download cache of the package manager (npm/pnpm/yarn) in GitHub Actions caches, keyed on the lockfile (ignored without a lockfile); setup-node saves one per ref, pull requests included."
  cache-node-modules:
    required: false
    default: 'false'
    description: "'true' caches the node_modules of the workspace in GitHub Actions caches, under a key made of the runner OS and architecture, manager, node version, workspace and lockfile content (ignored without a lockfile; `npm ci` deletes what was restored); pull requests only restore it, other events keep one per ref (needs the permission `actions: write` to delete the older ones)."
  artifactory-user:
    description: user use to connect at jfrog
    required: false
    default: ""
  artifactory-password:
    description: password use to connect at jfrog
    required: false
    default: ""
  artifactory-url:
    required: false
    default: 'http://jfrog:8081'
    description: artifactory url do you want to connect
  remote-token:
    description: token use to connect at remote
    required: false
    default: ''
  remote-user:
    description: user use to connect at remote
    required: false
    default: ''
  workspace:
    default: '.'
    required: false
    description: folder of the node project (package.json, lockfile, node_modules), relative to the repository root

runs:
  using: composite
  steps:
    - uses: pmeig/github-actions/actions/node/manager@main
      id: manager
      with:
        workspace: ${{ inputs.workspace }}
    # the package manager must be installed before setup-node: with the input `cache`, `cache: <manager>` runs it
    # (`pnpm store path`, `yarn cache dir`) to find the cache directory
    # the self-installer of pnpm/action-setup runs `npm`: the one bundled with some self-hosted runners
    # (externals/node24) is broken ("Cannot find module '../lib/cli.js'"), so put a working node first in the PATH
    - name: node for the pnpm installer
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.version }}
        package-manager-cache: false
    # pnpm project: a working unzip first in the PATH of the following steps (runner/unzip: the unzip of the
    # self-hosted runners is a tar wrapper without -q), so the jobs do not need their own unzip step
    - name: unzip for the pnpm installer
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: pmeig/github-actions/actions/runner/unzip@main
    - name: Install pnpm
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: pnpm/action-setup@v6
      with:
        # pnpm version from the packageManager field of the project in the workspace
        package_json_file: ${{ inputs.workspace }}/package.json
        # standalone binary: the self-installer otherwise runs the npm bundled with the runner
        # (externals/node24), which is broken on self-hosted runners ("Cannot find module '../lib/cli.js'")
        standalone: true
    - name: Install yarn
      if: ${{ steps.manager.outputs.value == 'yarn' }}
      shell: bash
      run: |
        npm i -g yarn
    # no GitHub Actions cache unless the input `cache` is 'true'. `package-manager-cache: false` only stops the
    # automatic cache of setup-node (packageManager field of the root package.json), not an explicit `cache`.
    # The cache of setup-node needs a lockfile ("Some specified paths were not resolved, unable to cache
    # dependencies"): a project without one gets no cache instead of a failure
    - uses: actions/setup-node@v6
      id: setup-node-version
      with:
        node-version: ${{ inputs.version }}
        package-manager-cache: false
        cache: ${{ inputs.cache == 'true' && steps.manager.outputs.lockfile != '' && steps.manager.outputs.value || '' }}
        cache-dependency-path: ${{ inputs.cache == 'true' && steps.manager.outputs.lockfile || '' }}
    - name: remote
      shell: bash
      if: ${{ inputs.remote-token != '' }}
      run: |
        ${{ steps.manager.outputs.value }} config set registry=https://registry.npmjs.org/
        if [ -n "${{ inputs.remote-user }}" ]
        then
          export AUTH_REMOTE=$(echo -n ${{ inputs.remote-user }}:${{ inputs.remote-password }} | base64 -w0)
          echo "//registry.npmjs.org/:_auth=$AUTH_REMOTE" >> ~/.npmrc
        else
          echo "//registry.npmjs.org/:_authToken=${{ inputs.remote-token }}" >> ~/.npmrc
        fi

    - shell: bash
      name: artifactory settings
      if: ${{ inputs.artifactory-user != '' && inputs.artifactory-password != '' }}
      run: |
        export AUTH=$(echo -n ${{ inputs.artifactory-user }}:${{ inputs.artifactory-password }} | base64 -w0)
        ${{ steps.manager.outputs.value }} config set @pmeig:registry=${{ inputs.artifactory-url }}/artifactory/
        {
          echo //${{ inputs.artifactory-url }}/artifactory/npm-snapshots-local:_auth=${AUTH}
          echo //${{ inputs.artifactory-url }}/artifactory/npm-releases-local:_auth=${AUTH}
          echo //${{ inputs.artifactory-url }}/artifactory/node:_auth=${AUTH}
        } >> ~/.npmrc

    - name: cache key
      id: modules-key
      if: ${{ inputs.cache-node-modules == 'true' && steps.manager.outputs.lockfile != '' }}
      shell: bash
      env:
        PREFIX: node-modules|${{ runner.os }}|${{ runner.arch }}|${{ steps.manager.outputs.value }}|node-${{ inputs.version }}|${{ inputs.workspace }}|
        HASH: ${{ hashFiles(steps.manager.outputs.lockfile) }}
      run: |
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX$HASH" >> "$GITHUB_OUTPUT"
    # pull request events only read; the other events write, then keep one entry of this prefix on their ref
    - name: restore cache
      if: ${{ inputs.cache-node-modules == 'true' && steps.manager.outputs.lockfile != '' && startsWith(github.event_name, 'pull_request') }}
      uses: actions/cache/restore@v5
      with:
        key: ${{ steps.modules-key.outputs.key }}
        restore-keys: ${{ steps.modules-key.outputs.prefix }}
        path: ${{ inputs.workspace }}/node_modules
    - name: apply cache
      if: ${{ inputs.cache-node-modules == 'true' && steps.manager.outputs.lockfile != '' && !startsWith(github.event_name, 'pull_request') }}
      uses: actions/cache@v5
      with:
        key: ${{ steps.modules-key.outputs.key }}
        restore-keys: ${{ steps.modules-key.outputs.prefix }}
        path: ${{ inputs.workspace }}/node_modules
    - name: delete the older caches of this ref
      if: ${{ inputs.cache-node-modules == 'true' && steps.manager.outputs.lockfile != '' && !startsWith(github.event_name, 'pull_request') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        CACHE_PREFIX: ${{ steps.modules-key.outputs.prefix }}
        CACHE_KEY: ${{ steps.modules-key.outputs.key }}
      run: bash '${{ github.action_path }}/../../cache/prune.sh'
