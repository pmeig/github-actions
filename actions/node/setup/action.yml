name: setup node
description: prepare setup to node

inputs:
  version:
    default: '24'
    description: version node do you want to setup
    required: false
  branch:
    required: true
    description: ''


  artifactory-user:
    description: user use to connect at jfrog
    required: false
    default: ""
  artifactory-password:
    description: password use to connect at jfrog
    required: false
    default: ""
  artifactory-url:
    required: false
    default: 'http://jfrog:8081'
    description: artifactory url do you want to connect
  remote-token:
    description: token use to connect at remote
    required: false
    default: ''
  remote-user:
    description: user use to connect at remote
    required: false
    default: ''
  workspace:
    default: '.'
    required: false
    description: folder of the node project (package.json, lockfile, node_modules), relative to the repository root

runs:
  using: composite
  steps:
    - uses: pmeig/github-actions/actions/node/manager@main
      id: manager
      with:
        workspace: ${{ inputs.workspace }}
    # the package manager must be installed before setup-node: `cache: <manager>` runs it
    # (`pnpm store path`, `yarn cache dir`) to find the cache directory
    # the self-installer of pnpm/action-setup runs `npm`: the one bundled with some self-hosted runners
    # (externals/node24) is broken ("Cannot find module '../lib/cli.js'"), so put a working node first in the PATH
    - name: node for the pnpm installer
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.version }}
    # pnpm project: a working unzip first in the PATH of the following steps (runner/unzip: the unzip of the
    # self-hosted runners is a tar wrapper without -q), so the jobs do not need their own unzip step
    - name: unzip for the pnpm installer
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: pmeig/github-actions/actions/runner/unzip@main
    - name: Install pnpm
      if: ${{ steps.manager.outputs.value == 'pnpm' }}
      uses: pnpm/action-setup@v6
      with:
        # pnpm version from the packageManager field of the project in the workspace
        package_json_file: ${{ inputs.workspace }}/package.json
        # standalone binary: the self-installer otherwise runs the npm bundled with the runner
        # (externals/node24), which is broken on self-hosted runners ("Cannot find module '../lib/cli.js'")
        standalone: true
    - name: Install yarn
      if: ${{ steps.manager.outputs.value == 'yarn' }}
      shell: bash
      run: |
        npm i -g yarn
    # the cache of setup-node needs a lockfile ("Some specified paths were not resolved, unable to cache
    # dependencies"): a project without one gets no cache instead of a failure
    - uses: actions/setup-node@v6
      id: setup-node-version
      with:
        node-version: ${{ inputs.version }}
        # pull request, pnpm: no cache saved by the PR (read below); other cases: cache of setup-node
        cache: ${{ steps.manager.outputs.lockfile != '' && (github.event_name != 'pull_request' || steps.manager.outputs.value != 'pnpm') && steps.manager.outputs.value || '' }}
        cache-dependency-path: ${{ steps.manager.outputs.lockfile }}
    # pull request: read the pnpm store saved by develop (same key as setup-node), never write it
    - name: pnpm store of develop
      if: ${{ github.event_name == 'pull_request' && steps.manager.outputs.value == 'pnpm' && steps.manager.outputs.lockfile != '' }}
      shell: bash
      run: echo "PNPM_STORE=$(pnpm store path --silent)" >> $GITHUB_ENV
    - name: restore pnpm store
      if: ${{ github.event_name == 'pull_request' && steps.manager.outputs.value == 'pnpm' && steps.manager.outputs.lockfile != '' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.PNPM_STORE }}
        key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles(steps.manager.outputs.lockfile) }}
        restore-keys: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-
    - name: remote
      shell: bash
      if: ${{ inputs.remote-token != '' }}
      run: |
        ${{ steps.manager.outputs.value }} config set registry=https://registry.npmjs.org/
        if [ -n "${{ inputs.remote-user }}" ]
        then
          export AUTH_REMOTE=$(echo -n ${{ inputs.remote-user }}:${{ inputs.remote-password }} | base64 -w0)
          echo "//registry.npmjs.org/:_auth=$AUTH_REMOTE" >> ~/.npmrc
        else
          echo "//registry.npmjs.org/:_authToken=${{ inputs.remote-token }}" >> ~/.npmrc
        fi

    - shell: bash
      name: artifactory settings
      if: ${{ inputs.artifactory-user != '' && inputs.artifactory-password != '' }}
      run: |
        export AUTH=$(echo -n ${{ inputs.artifactory-user }}:${{ inputs.artifactory-password }} | base64 -w0)
        ${{ steps.manager.outputs.value }} config set @pmeig:registry=${{ inputs.artifactory-url }}/artifactory/
        {
          echo //${{ inputs.artifactory-url }}/artifactory/npm-snapshots-local:_auth=${AUTH}
          echo //${{ inputs.artifactory-url }}/artifactory/npm-releases-local:_auth=${AUTH}
          echo //${{ inputs.artifactory-url }}/artifactory/node:_auth=${AUTH}
        } >> ~/.npmrc

    # pull request: node_modules of develop read only (the key of the PR itself never exists, develop is the fallback);
    # other events: read and save under the key of the branch
    - name: cache node_modules
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/cache@v5
      with:
        key: ${{ steps.manager.outputs.value }}-${{ inputs.branch }}
        path: ${{ inputs.workspace }}/node_modules
    - name: restore node_modules of develop
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/cache/restore@v5
      with:
        key: ${{ steps.manager.outputs.value }}-${{ inputs.branch }}
        restore-keys: ${{ steps.manager.outputs.value }}-develop
        path: ${{ inputs.workspace }}/node_modules
