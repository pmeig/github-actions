name: find files modified
description: find all files modified

inputs:
  target:
    description: target sha or branch or tag use to compare on origin
    required: false
    default: ''
  origin:
    description: origin sha or branch or tag to compare
    required: false
    default: ''
  parent:
    description: only parent
    required: false
    default: 'false'
  includes:
    description: "filter format start=<starter> end=<end> contains=<contains>"
    default: ''
    required: false
  excludes:
    description: "filter format start=<starter> end=<end> contains=<contains>"
    default: ''
    required: false


outputs:
  files:
    value: ${{ steps.excludes.outputs.value }}
    description: all files modify
  parents:
    value: ${{ steps.parents.outputs.path }}
    description: all parents files modify

runs:
  using: composite
  steps:
    - name: get branch
      id: branch
      uses: pmeig/github-actions/actions/github/branch@main
    - name: find files
      id: files
      shell: bash
      if: ${{ github.event.pull_request.merged == false }}
      run: |
        files=''
        from='${{ inputs.origin }}'
        to='${{ inputs.target }}'
        if [ -z "$from" ]
        then
          from='${{ steps.branch.outputs.current }}'
        fi
        if [ -z "$to" ]
        then
          to='${{ steps.branch.outputs.target }}'
        fi
        compare=$(curl -L -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${{ github.token }}" -H \
        "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/compare/$to...$from )
        names=$(echo "$compare" | jq -r '.files[]?.filename')
        # the compare API lists 300 files at most (alphabetical order, no pagination): the end of a bigger diff,
        # often the last modules (server, web), is silently dropped. Then the diff is computed by git, from the
        # merge base given by the API (same meaning as compare/$to...$from)
        if [ "$(echo "$compare" | jq '.files | length')" -ge 300 ]
        then
          base=$(echo "$compare" | jq -r '.merge_base_commit.sha // empty')
          if [ -n "$base" ] && git rev-parse --git-dir > /dev/null 2>&1 \
            && git fetch --no-tags --depth=1 origin "$base" \
            && base=$(git rev-parse FETCH_HEAD) \
            && git fetch --no-tags --depth=1 origin "$from"
          then
            names=$(git diff --name-only "$base" FETCH_HEAD)
          else
            echo "::warning::compare lists 300 files (API limit) and git could not complete it: the list may be truncated"
          fi
        fi
        for name in $names
        do
          files="$name $files"
        done
        echo "path=$(echo $files)" >> $GITHUB_OUTPUT
    - name: find files pull request
      id: pull-request-files
      shell: bash
      if: ${{ github.event.pull_request.merged == true }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        diff=$(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files.[].path')
        files=''
        for name in $diff
        do
          files="$name $files"
        done
         echo "path=$(echo $files)" >> $GITHUB_OUTPUT
    - name: apply includes
      id: includes
      uses: pmeig/github-actions/actions/github/diff/filter@main
      with:
        files: ${{ steps.files.outputs.path }}${{ steps.pull-request-files.outputs.path }}
        filter: ${{ inputs.includes }}
    - name: apply excludes
      id: excludes
      uses: pmeig/github-actions/actions/github/diff/filter@main
      with:
        files: ${{ steps.includes.outputs.value }}
        filter: ${{ inputs.excludes }}
        accept: false
    - name: find parent files
      if: ${{ inputs.parent == 'true' }}
      id: parents
      shell: bash
      run: |
        parents=' '
        for file in ${{ steps.excludes.outputs.value }}
        do
          parent=$(dirname $file)
          # stop at the first module (npm, Maven or Gradle build root), or at the repository root
          while [ "$parent" != "." ] && [ "$parent" != "/" ] && [ "$parent" != "$GITHUB_WORKSPACE" ] \
            && [ ! -f "$parent/package.json" ] && [ ! -f "$parent/pom.xml" ] \
            && [ ! -f "$parent/settings.gradle.kts" ] && [ ! -f "$parent/settings.gradle" ]
          do
            parent=$(dirname $parent)
          done
          if [[ " $parents " != *" $parent "* ]]
          then
            parents="$parents $parent"
          fi
        done
        echo "path=$parents" >> $GITHUB_OUTPUT
    - name: clean diff
      shell: bash
      run: |
        rm -rf tmp
