name: unzip shim
description: >
  put a working `unzip` (keeping the file permissions) first in the PATH of the following steps; /usr/local/bin/unzip of the
  self-hosted runners is a tar wrapper that rejects the options of unzip (-q), which breaks
  actions extracting zip archives (sonarqube-scan-action, setup-android...)

runs:
  using: composite
  steps:
    - name: install unzip shim
      shell: bash
      run: |
        bin="$RUNNER_TEMP/unzip-shim"
        mkdir -p "$bin"
        cat > "$bin/unzip" <<'SHIM'
        #!/usr/bin/env bash
        # unzip [-o] [-q|-qq] <archive> [-d <directory>]: the options other than -d are ignored
        archive=''
        directory='.'
        while [ $# -gt 0 ]
        do
          case "$1" in
            -d) directory="$2"; shift ;;
            -*) ;;
            *) [ -z "$archive" ] && archive="$1" ;;
          esac
          shift
        done
        [ -n "$archive" ] || { echo "usage: unzip [-o] [-q] archive [-d directory]" >&2; exit 64; }
        mkdir -p "$directory"
        # bsdtar first: it keeps the permissions of the archive (sonar-scanner must stay executable)
        if command -v bsdtar > /dev/null
        then
          exec bsdtar -xf "$archive" -C "$directory"
        elif command -v python3 > /dev/null
        then
          # python's zipfile drops the permissions: put them back
          exec python3 -c 'import sys, zipfile, os
        z = zipfile.ZipFile(sys.argv[1])
        for i in z.infolist():
            p = z.extract(i, sys.argv[2])
            m = i.external_attr >> 16
            if m:
                os.chmod(p, m)' "$archive" "$directory"
        elif command -v jar > /dev/null
        then
          archive=$(realpath "$archive")
          cd "$directory" && exec jar xf "$archive"
        fi
        echo "unzip: no python3, bsdtar or jar to extract $archive" >&2
        exit 1
        SHIM
        chmod +x "$bin/unzip"
        echo "$bin" >> $GITHUB_PATH
    # tools already cached by an earlier run that extracted without the permissions (python zipfile): give back the
    # executable bit of their binaries, the setup actions reuse the cache instead of extracting again
    - name: fix the permissions of the cached tools
      shell: bash
      run: |
        for tool in "$RUNNER_TOOL_CACHE"/sonar-scanner-cli/*/*/bin "$RUNNER_TOOL_CACHE"/sonar-scanner-cli/*/*/jre/bin
        do
          [ -d "$tool" ] \&\& chmod -R u+x "$tool"
        done
        exit 0
