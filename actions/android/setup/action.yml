name: setup android sdk
description: >
  install the Android command line tools and accept the licenses; a replacement of
  android-actions/setup-android for runners whose /usr/local/bin/unzip does not support `-q`
  (the archive is extracted with `jar`, so a JDK must be set up before)

inputs:
  cmdline-tools-version:
    default: '15859902'
    required: false
    description: version of the Android command line tools
  packages:
    default: 'platform-tools'
    required: false
    description: 'SDK packages to install, separated by space'

runs:
  using: composite
  steps:
    - name: install command line tools
      shell: bash
      env:
        VERSION: ${{ inputs.cmdline-tools-version }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        sdk="${ANDROID_HOME:-$HOME/android-sdk}"
        tools="$sdk/cmdline-tools/latest"
        if [ ! -x "$tools/bin/sdkmanager" ]
        then
          archive="$RUNNER_TEMP/cmdline-tools.zip"
          curl -fsSL -o "$archive" "https://dl.google.com/android/repository/commandlinetools-linux-${VERSION}_latest.zip"
          extract="$RUNNER_TEMP/cmdline-tools"
          rm -rf "$extract"
          mkdir -p "$extract" "$sdk/cmdline-tools"
          (cd "$extract" && jar xf "$archive")
          rm -rf "$tools"
          mv "$extract/cmdline-tools" "$tools"
          chmod +x "$tools"/bin/*
        fi
        {
          echo "ANDROID_HOME=$sdk"
          echo "ANDROID_SDK_ROOT=$sdk"
        } >> $GITHUB_ENV
        echo "$tools/bin" >> $GITHUB_PATH
        echo "$sdk/platform-tools" >> $GITHUB_PATH
        yes | "$tools/bin/sdkmanager" --sdk_root="$sdk" --licenses > /dev/null || true
        "$tools/bin/sdkmanager" --sdk_root="$sdk" $PACKAGES
