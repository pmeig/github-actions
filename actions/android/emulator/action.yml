name: android emulators
description: >
  start Android emulators in Docker containers (image budtmo/docker-android, free) next to the runner, through the
  Docker socket of the host: the host must have KVM (/dev/kvm). The runner joins their network and reaches them with
  `adb connect`; the APK is installed and the ports of the runner are reversed on each device (`adb reverse`: the app
  calls http://localhost:<port> and reaches a server started on the runner). android/emulator/stop removes them.

inputs:
  count:
    required: false
    default: '1'
    description: >
      number of emulators wanted in parallel, at most: scaled down to what the host can carry (free memory divided by
      the memory of an emulator, CPUs divided by `cpus-per-emulator`, at least 1) - five emulators on a host with 8 GB
      free make it swap and the emulators die (adb `offline`)
  memory-per-emulator:
    required: false
    default: 'auto'
    description: >
      MB of host memory counted per emulator. 'auto' shares the memory available on the host between the emulators
      wanted (available / count); when that share is under `min-memory-per-emulator`, fewer emulators are started so
      that each keeps that minimum. A number fixes it. The share is also set on each container as a soft limit
      (`--memory-reservation`), so that an emulator that grows takes it from the others' unused memory first.
  min-memory-per-emulator:
    required: false
    default: '4608'
    description: MB under which an emulator is not started in 'auto' mode (measured 4.4 to 5.5 GB per container while it runs the flows)
  cpus-per-emulator:
    required: false
    default: '2'
    description: CPUs counted per emulator
  image:
    required: false
    default: 'budtmo/docker-android:emulator_14.0'
    description: Docker image of the emulator (adb on port 5555, `device_status` READY once booted)
  device:
    required: false
    default: 'Samsung Galaxy S10'
    description: device profile of the emulator (EMULATOR_DEVICE of the image)
  network:
    required: false
    default: ''
    description: Docker network shared with the runner (default pmeig-<run id>-<job>), created when missing
  apk:
    required: false
    default: ''
    description: APK installed on every emulator (none = nothing installed)
  reverse-ports:
    required: false
    default: ''
    description: ports of the runner reached by the devices at localhost:<port>, separated by space
  disable-keyboard:
    required: false
    default: 'true'
    description: "'true' disables the soft keyboards: they would hide the bottom of the screens"
  timeout:
    required: false
    default: '900'
    description: seconds to wait for every emulator to boot (counted from the start of the last one)
  stagger:
    required: false
    default: '15'
    description: seconds between the start of two emulators (booting all of them at once starves the host of CPU and I/O)
  emulator-args:
    required: false
    default: '-memory 2048 -no-audio -no-boot-anim'
    description: arguments added to the `emulator` command (EMULATOR_ADDITIONAL_ARGS of the image)
  snapshot:
    required: false
    default: 'false'
    description: >
      'true' starts the emulators from a snapshot of an already booted one (a few seconds instead of a full Android
      boot): the first run on a Docker host boots one emulator, saves its state (`default_boot`) and keeps it in the
      local image pmeig-emulator-warm:<hash of image, device and emulator-args> (about 8 GB more than `image`), the
      next ones reuse it, whatever the workflow or the repository: it belongs to the Docker host, not to the run.
      Several jobs at once wait for the first one to build it (at most `snapshot-timeout`), then boot normally if it
      is still missing. Another `image`, `device` or `emulator-args` builds another one next to it: remove the ones that
      are not used any more with `docker image rm` (or `docker image prune -a` on the host).
  gpu:
    required: false
    default: 'auto'
    description: >
      renders the screen of the emulators with the GPU of the Docker host instead of the CPU (`-gpu host`). Measured on a
      WSL2 host (RTX 5070 Laptop, 2 CPUs per emulator, all started together, 2 to 4 emulators): janky frames while scrolling
      85-99% with the CPU renderer against 8-17% with the GPU on every emulator, the same boot time, no more load on the host.
      'auto' uses it when the host has /dev/dxg (WSL2 GPU) and Docker can give it to a container, otherwise the CPU renderer;
      'true' requires it (error when not available); 'false' keeps the CPU renderer. It changes the arguments of the emulator,
      so the snapshot (see `snapshot`) is built again once for it.
  snapshot-timeout:
    required: false
    default: '600'
    description: seconds to wait to build the snapshot (or for another job that builds it) before booting Android normally

outputs:
  count:
    value: ${{ steps.start.outputs.count }}
    description: number of emulators started (the number wanted, scaled down to the capacity of the host)
  devices:
    value: ${{ steps.start.outputs.devices }}
    description: adb serials of the emulators (<ip>:5555), separated by comma
  network:
    value: ${{ steps.start.outputs.network }}
    description: Docker network of the emulators and the runner
  label:
    value: ${{ steps.start.outputs.label }}
    description: Docker label of the containers started (for android/emulator/stop or docker/cleanup)

runs:
  using: composite
  steps:
    - name: start the emulators
      id: start
      shell: bash
      env:
        COUNT: ${{ inputs.count }}
        IMAGE: ${{ inputs.image }}
        DEVICE: ${{ inputs.device }}
        NETWORK: ${{ inputs.network }}
        TIMEOUT: ${{ inputs.timeout }}
        STAGGER: ${{ inputs.stagger }}
        EMULATOR_ARGS: ${{ inputs.emulator-args }}
        SNAPSHOT: ${{ inputs.snapshot }}
        GPU: ${{ inputs.gpu }}
        SNAPSHOT_TIMEOUT: ${{ inputs.snapshot-timeout }}
        MEMORY_PER: ${{ inputs.memory-per-emulator }}
        MEMORY_MIN: ${{ inputs.min-memory-per-emulator }}
        CPUS_PER: ${{ inputs.cpus-per-emulator }}
      run: |
        command -v adb > /dev/null || { echo "::error::adb not found: run android/setup (platform-tools) first"; exit 1; }
        if ! docker run --rm --device /dev/kvm busybox true > /dev/null 2>&1
        then
          echo "::error::the Docker host has no /dev/kvm: an Android emulator needs hardware acceleration (enable KVM on the host of the runners)"
          exit 1
        fi
        # GPU of the host (WSL2: /dev/dxg + the libraries of the driver, rendering by Mesa d3d12), given to the containers
        gpu_docker=()
        if [ "$GPU" != 'false' ]
        then
          if docker run --rm --device /dev/dxg -v /usr/lib/wsl:/usr/lib/wsl:ro busybox true > /dev/null 2>&1
          then
            gpu_docker=(--device /dev/dxg -v /usr/lib/wsl:/usr/lib/wsl:ro -e LD_LIBRARY_PATH=/usr/lib/wsl/lib -e GALLIUM_DRIVER=d3d12 -e MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA)
            EMULATOR_ARGS="$EMULATOR_ARGS -gpu host"
            echo "emulators rendered by the GPU of the host"
          elif [ "$GPU" == 'true' ]
          then
            echo "::error::gpu is 'true' but the Docker host has no /dev/dxg (GPU of WSL2) usable by a container"
            exit 1
          else
            echo "no GPU usable by the containers: the emulators are rendered by the CPU"
          fi
        fi
        # what the host can carry: an emulator that does not fit makes the host swap and every emulator dies
        cpus=$(nproc)
        available=$(free -m | awk '/^Mem:/ {print $7}')
        echo "host: $cpus cpu(s), $(free -m | awk '/^Mem:/ {print $2}') MB, $available MB available"
        wanted=$COUNT
        if [ "$MEMORY_PER" == 'auto' ]
        then
          # the memory available is shared between the emulators wanted, without going under the minimum of one emulator
          MEMORY_PER=$(( available / (COUNT < 1 ? 1 : COUNT) ))
          (( MEMORY_PER < MEMORY_MIN )) && MEMORY_PER=$MEMORY_MIN
        fi
        fit=$(( available / MEMORY_PER ))
        (( cpus / CPUS_PER < fit )) && fit=$(( cpus / CPUS_PER ))
        (( fit < 1 )) && fit=1
        if (( COUNT > fit ))
        then
          COUNT=$fit
          echo "::warning::$wanted emulators wanted, $COUNT started: $available MB of memory (${MEMORY_PER} MB each) and $cpus CPU(s) (${CPUS_PER} each) available on the host"
        fi
        echo "emulators: $COUNT of $wanted wanted, ${MEMORY_PER} MB of memory each"
        network="${NETWORK:-pmeig-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}}"
        label="pmeig.run=${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}"
        docker network inspect "$network" > /dev/null 2>&1 || docker network create --label "$label" "$network" > /dev/null
        # the runner is a container of the same host: it joins the network to reach the emulators
        docker network connect "$network" "$(cat /etc/hostname)" > /dev/null 2>&1 || true
        docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$(cat /etc/hostname)" | grep -qw "$network" \
          || { echo "::error::the runner could not join the network $network: it cannot reach the emulators"; exit 1; }

        # diagnostic of an emulator that does not come up: what the image says, its log, adb, the load of the host
        diagnose() {
          local name=$1 serial=$2
          echo "::group::diagnostic of $name"
          echo "device_status of the image: $(docker exec "$name" cat device_status 2>&1 | head -c 200)"
          docker ps -a --filter "name=$name" --format 'container: {{.Status}}'
          echo "--- adb (runner): $(adb devices | tr '\n' ' ')"
          echo "--- boot_completed: $(timeout 10 adb -s "$serial" shell getprop sys.boot_completed 2>&1 | tr -d '\r')"
          echo "--- docker logs (last 80 lines)"
          docker logs --tail 80 "$name" 2>&1 || true
          echo "--- host"
          uptime
          docker stats --no-stream --format '{{.Name}}: cpu {{.CPUPerc}}, memory {{.MemUsage}}' $(docker ps -q --filter "label=$label") 2>&1 || true
          echo "::endgroup::"
        }

        # Android booted, asked to adb INSIDE the container (the snapshot is taken there, from the console of the emulator)
        booted_in() {
          [ "$(docker inspect -f '{{.State.Running}}' "$1" 2>/dev/null)" == 'true' ] \
            && [ "$(timeout 10 docker exec "$1" adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')" == '1' ] \
            && timeout 10 docker exec "$1" adb -s emulator-5554 shell pm path android > /dev/null 2>&1
        }

        # boots one emulator, saves its state as the quick boot snapshot and keeps the container as the image $1
        build_warm_image() {
          local tag=$1 name="warm-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}" deadline=$((SECONDS + SNAPSHOT_TIMEOUT)) clean="warm-clean-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}"
          docker rm -f "$name" "$clean" > /dev/null 2>&1 || true
          docker run -d --name "$name" --label "$label" --device /dev/kvm "${gpu_docker[@]}" \
            -e EMULATOR_DEVICE="$DEVICE" -e EMULATOR_ADDITIONAL_ARGS="$EMULATOR_ARGS" \
            -e WEB_VNC=false -e WEB_LOG=false -e APPIUM=false "$IMAGE" > /dev/null || return 1
          until booted_in "$name"
          do
            (( SECONDS > deadline )) && { echo "::warning::the emulator of the snapshot did not boot in ${SNAPSHOT_TIMEOUT}s"; return 1; }
            sleep 5
          done
          sleep 20 # the system settles before its state is kept
          docker exec "$name" adb -s emulator-5554 emu avd snapshot save default_boot 2>&1 | tr -d '\r' | grep -qx 'OK' || return 1
          docker stop -t 60 "$name" > /dev/null || return 1
          # what the stopped container still holds would prevent the next start: the image removes the first line of /etc/passwd
          # at every start (so root is lost after a commit), and X11 and emulator locks of the previous run
          local root_line user entrypoint cmd changes=()
          # the root line of the ORIGINAL image, whatever it is (found, not written here): the image starts with `sudo`
          # (chown of /dev/kvm) and fails with "unknown user root" when the line is missing
          root_line=$(docker run --rm --entrypoint sh "$IMAGE" -c 'grep -m1 "^root:" /etc/passwd') || return 1
          [ -n "$root_line" ] || return 1
          # the cleaning container below runs as root with another entrypoint: the image keeps those of the original one
          user=$(docker inspect -f '{{.Config.User}}' "$IMAGE")
          entrypoint=$(docker inspect -f '{{json .Config.Entrypoint}}' "$IMAGE")
          cmd=$(docker inspect -f '{{json .Config.Cmd}}' "$IMAGE")
          [ -n "$user" ] && changes+=(--change "USER $user")
          [ "$entrypoint" != 'null' ] && changes+=(--change "ENTRYPOINT $entrypoint")
          [ "$cmd" != 'null' ] && changes+=(--change "CMD $cmd")
          docker commit "$name" "$tag" > /dev/null || return 1
          # root line put back from inside the container (the file is rewritten in place, not replaced)
          # (user 0, not "root": the name is looked up in the very file that lacks it)
          docker run --name "$clean" --user 0 --entrypoint sh -e ROOT_LINE="$root_line" "$tag" -c \
            'grep -q "^root:" /etc/passwd || { { printf "%s\n" "$ROOT_LINE"; cat /etc/passwd; } > /tmp/passwd.new && cat /tmp/passwd.new > /etc/passwd; }
             rm -rf /tmp/passwd.new /tmp/.X0-lock /tmp/.X11-unix/* /tmp/android* /tmp/hostapd* /tmp/netsim.ini /tmp/adb.*.log /home/androidusr/emulator/*.lock' || return 1
          docker commit "${changes[@]}" "$clean" "$tag" > /dev/null || return 1
          # an image that cannot start is not kept
          warm_usable "$tag" || { echo "::warning::the snapshot $tag cannot run sudo (root user missing): not kept"; return 1; }
        }

        # an image of the snapshot is usable when it exists and its user can still run sudo (the image needs it at every start)
        warm_usable() {
          docker image inspect "$1" > /dev/null 2>&1 \
            && docker run --rm --entrypoint sh "$1" -c 'sudo -n true' > /dev/null 2>&1
        }

        # image of the emulators started from a snapshot: built once per Docker host and per image/device/arguments
        warm_image() {
          local tag="pmeig-emulator-warm:$(printf '%s|%s|%s' "$IMAGE" "$DEVICE" "$EMULATOR_ARGS" | sha1sum | cut -c1-12)"
          local lock="pmeig-warm-lock-${tag##*:}" deadline=$((SECONDS + SNAPSHOT_TIMEOUT)) locked=1 created
          # the lock is a Docker network: creating it is atomic on the host shared by the runners, and its label makes
          # android/emulator/stop (docker/cleanup) remove it with the job, even when the job is killed
          while ! warm_usable "$tag"
          do
            if docker network create --label "$label" "$lock" > /dev/null 2>&1
            then
              locked=0
              break
            fi
            created=$(docker network inspect -f '{{.Created}}' "$lock" 2>/dev/null | cut -d. -f1)
            if [ -n "$created" ] && (( $(date +%s) - $(date -d "$created" +%s) > SNAPSHOT_TIMEOUT + 120 ))
            then
              echo "removing a stale lock of the snapshot ($lock)"
              docker network rm "$lock" > /dev/null 2>&1 || true
            fi
            (( SECONDS > deadline )) && break
            sleep 5
          done
          if (( locked == 0 ))
          then
            # another job may have built it between the check and the lock
            if ! warm_usable "$tag"
            then
              # a snapshot built by an earlier version of this action may exist but be broken: replaced
              docker image rm -f "$tag" > /dev/null 2>&1 || true
              echo "building the snapshot $tag (boots one emulator, once per Docker host)"
              if ! build_warm_image "$tag"
              then
                docker image rm "$tag" > /dev/null 2>&1 || true
              fi
              docker rm -f "warm-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}" "warm-clean-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}" > /dev/null 2>&1 || true
            fi
            docker network rm "$lock" > /dev/null 2>&1 || true
          fi
          if ! warm_usable "$tag"
          then
            echo "::warning::the snapshot is not available: the emulators boot Android normally"
            return 1
          fi
          IMAGE=$tag
          EMULATOR_ARGS="$EMULATOR_ARGS -no-snapshot-save"
          echo "emulators started from the snapshot $tag"
        }
        [ "$SNAPSHOT" == 'true' ] && { warm_image || true; }

        names=()
        for index in $(seq 1 "$COUNT")
        do
          name="emulator-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RUNNER_NAME}-${index}"
          docker rm -f "$name" > /dev/null 2>&1 || true
          docker run -d --name "$name" --label "$label" --network "$network" --device /dev/kvm "${gpu_docker[@]}" --memory-reservation "${MEMORY_PER}m" \
            -e EMULATOR_DEVICE="$DEVICE" -e EMULATOR_ADDITIONAL_ARGS="$EMULATOR_ARGS" \
            -e WEB_VNC=false -e WEB_LOG=false -e APPIUM=false "$IMAGE" > /dev/null
          names+=("$name")
          (( index < COUNT )) && sleep "$STAGGER"
        done

        # android is ready when it says so (adb), not when the image says so: its own check gives up after 5 minutes,
        # which a loaded host can exceed while the emulator finishes booting
        devices=()
        deadline=$((SECONDS + TIMEOUT))
        for name in "${names[@]}"
        do
          ip=''
          serial=''
          last=$SECONDS
          until [ -n "$serial" ] && [ "$(timeout 10 adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')" == '1' ] \
            && timeout 10 adb -s "$serial" shell pm path android > /dev/null 2>&1
          do
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != 'true' ]
            then
              diagnose "$name" "${serial:-none}"
              echo "::error::emulator $name stopped"
              exit 1
            fi
            if (( SECONDS > deadline ))
            then
              diagnose "$name" "${serial:-none}"
              echo "::error::emulator $name did not boot in ${TIMEOUT}s (see the diagnostic above)"
              exit 1
            fi
            if [ -z "$ip" ]
            then
              ip=$(docker inspect -f "{{(index .NetworkSettings.Networks \"$network\").IPAddress}}" "$name")
            fi
            [ -n "$ip" ] && { adb connect "$ip:5555" > /dev/null 2>&1; serial="$ip:5555"; }
            (( SECONDS - last >= 60 )) && { last=$SECONDS; echo "$name: still booting ($(( deadline - SECONDS ))s left, image status: $(docker exec "$name" cat device_status 2>/dev/null | head -c 40), adb: $(adb devices | awk -v s="$serial" '$1 == s {print $2}'), host available: $(free -m | awk '/^Mem:/ {print $7}') MB)"; }
            sleep 5
          done
          echo "$name ready: $serial"
          devices+=("$serial")
        done
        echo "devices=$(IFS=,; echo "${devices[*]}")" >> $GITHUB_OUTPUT
        echo "count=$COUNT" >> $GITHUB_OUTPUT
        echo "network=$network" >> $GITHUB_OUTPUT
        echo "label=$label" >> $GITHUB_OUTPUT
    - name: prepare the devices
      shell: bash
      env:
        DEVICES: ${{ steps.start.outputs.devices }}
        APK: ${{ inputs.apk }}
        PORTS: ${{ inputs.reverse-ports }}
        KEYBOARD: ${{ inputs.disable-keyboard }}
      run: |
        for serial in ${DEVICES//,/ }
        do
          [ -n "$APK" ] && adb -s "$serial" install -r "$APK" > /dev/null
          for port in $PORTS
          do
            adb -s "$serial" reverse "tcp:$port" "tcp:$port" > /dev/null
          done
          if [ "$KEYBOARD" == 'true' ]
          then
            for ime in $(adb -s "$serial" shell ime list -s | tr -d '\r')
            do
              adb -s "$serial" shell ime disable "$ime" > /dev/null
            done
          fi
          echo "$serial prepared"
        done
