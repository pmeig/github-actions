name: setup java
description: install java and prepare cache and settings

inputs:
  branch:
    required: false
    description: unused, kept so that existing callers passing it stay valid
    default: ''
  cache:
    required: false
    default: 'false'
    description: "'true' caches the Maven dependencies in GitHub Actions caches through `cache: maven` of actions/setup-java; setup-java saves one per ref, pull requests included."
  cache-repository:
    required: false
    default: 'false'
    description: "'true' caches the local Maven repository in GitHub Actions caches, under a key made of the runner OS and architecture and the content of the pom.xml files; pull requests only restore it, other events keep one per ref (needs the permission `actions: write` to delete the older ones)."
  java:
    required: false
    default: '26'
    description: java version
  artifactory-user:
    required: false
    default: ''
    description: user artifactory
  artifactory-password:
    required: false
    default: ''
    description: artifactory password
  artifactory-url:
    required: false
    default: 'http://jfrog'
    description: artifactory url do you want to connect

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java }}
        distribution: 'temurin'
        cache: ${{ inputs.cache == 'true' && 'maven' || '' }}
    - name: add configuration maven to create server to deploy
      uses: pmeig/github-actions/actions/java/setup/settings@main
      if: ${{ inputs.artifactory-user != '' && inputs.artifactory-password != '' }}
      with:
        artifactory-user: ${{ inputs.artifactory-user }}
        artifactory-password: ${{ inputs.artifactory-password }}
        artifactory-url: ${{ inputs.artifactory-url }}
    - name: find repository localization
      uses: pmeig/github-actions/actions/java/maven/read@main
      if: ${{ inputs.cache-repository == 'true' }}
      id: path
      with:
        expression: settings.localRepository
    - name: cache key
      id: repository-key
      if: ${{ inputs.cache-repository == 'true' }}
      shell: bash
      env:
        PREFIX: mvn-repository|${{ runner.os }}|${{ runner.arch }}|
        HASH: ${{ hashFiles('**/pom.xml') }}
      run: |
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX$HASH" >> "$GITHUB_OUTPUT"
    # pull request events only read; the other events write, then keep one entry of this prefix on their ref
    - name: restore cache
      if: ${{ inputs.cache-repository == 'true' && startsWith(github.event_name, 'pull_request') }}
      uses: actions/cache/restore@v5
      with:
        key: ${{ steps.repository-key.outputs.key }}
        restore-keys: ${{ steps.repository-key.outputs.prefix }}
        path: ${{ steps.path.outputs.value }}
    - name: apply cache
      if: ${{ inputs.cache-repository == 'true' && !startsWith(github.event_name, 'pull_request') }}
      uses: actions/cache@v5
      with:
        key: ${{ steps.repository-key.outputs.key }}
        restore-keys: ${{ steps.repository-key.outputs.prefix }}
        path: ${{ steps.path.outputs.value }}
    - name: delete the older caches of this ref
      if: ${{ inputs.cache-repository == 'true' && !startsWith(github.event_name, 'pull_request') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        CACHE_PREFIX: ${{ steps.repository-key.outputs.prefix }}
        CACHE_KEY: ${{ steps.repository-key.outputs.key }}
      run: bash '${{ github.action_path }}/../../cache/prune.sh'
