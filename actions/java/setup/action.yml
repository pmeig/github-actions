name: setup java
description: install java and prepare cache and settings

inputs:
  branch:
    required: false
    description: branch name, part of the key of `cache-repository`
    default: ''
  cache:
    required: false
    default: 'false'
    description: "'true' caches the Maven dependencies in GitHub Actions caches through `cache: maven` of actions/setup-java."
  cache-repository:
    required: false
    default: 'false'
    description: "'true' caches the local Maven repository in GitHub Actions caches, under a key made of the runner OS and architecture, branch and content of the pom.xml files."
  java:
    required: false
    default: '26'
    description: java version
  artifactory-user:
    required: false
    default: ''
    description: user artifactory
  artifactory-password:
    required: false
    default: ''
    description: artifactory password
  artifactory-url:
    required: false
    default: 'http://jfrog'
    description: artifactory url do you want to connect

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java }}
        distribution: 'temurin'
        cache: ${{ inputs.cache == 'true' && 'maven' || '' }}
    - name: add configuration maven to create server to deploy
      uses: pmeig/github-actions/actions/java/setup/settings@main
      if: ${{ inputs.artifactory-user != '' && inputs.artifactory-password != '' }}
      with:
        artifactory-user: ${{ inputs.artifactory-user }}
        artifactory-password: ${{ inputs.artifactory-password }}
        artifactory-url: ${{ inputs.artifactory-url }}
    - name: find repository localization
      uses: pmeig/github-actions/actions/java/maven/read@main
      if: ${{ inputs.cache-repository == 'true' }}
      id: path
      with:
        expression: settings.localRepository
    - name: apply cache
      uses: actions/cache@v5
      if: ${{ inputs.cache-repository == 'true' }}
      with:
        key: mvn-${{ runner.os }}-${{ runner.arch }}-${{ inputs.branch }}-${{ hashFiles('**/pom.xml') }}
        path: ${{ steps.path.outputs.value }}
